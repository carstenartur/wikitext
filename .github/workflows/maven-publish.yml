name: Maven Package

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.16
      - name: Build with Maven
        run: mvn -B --no-transfer-progress package --file wikitext-sample/pom.xml
      - name: Publish to GitHub Packages
        run: mvn -B --no-transfer-progress deploy -s "$GITHUB_WORKSPACE/settings.xml" --file wikitext-sample/pom.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
