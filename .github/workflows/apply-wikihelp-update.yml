name: Apply modular WikiHelp update

on:
  push:
    branches: [chore/eclipse-2026-06]
    paths:
      - ".wikihelp-update/**"
      - ".github/workflows/apply-wikihelp-update.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply prepared source update
        run: python .wikihelp-update/apply.py
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.16
      - name: Check and build
        run: |
          git diff --check
          mvn -B --no-transfer-progress verify --file wikitext-sample/pom.xml
      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Modularize wiki sources and Eclipse Help generation"
          git push origin HEAD:chore/eclipse-2026-06
